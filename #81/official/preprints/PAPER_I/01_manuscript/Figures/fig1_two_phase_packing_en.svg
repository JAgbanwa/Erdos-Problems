<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" font-family="Georgia, 'Times New Roman', serif">
  <style>
    .lbl{font-size:18px;fill:#2b2b2b}
    .cap{font-size:15px;fill:#3a3a3a}
    .kn{fill:#52657b;stroke:#2f3b47;stroke-width:1.4}
    .in{fill:#9aa3ad;stroke:#5c636b;stroke-width:1.4}
    .ce{stroke:#c3c7cd;stroke-width:1.3}
    .p1{fill:#4f7d6c;fill-opacity:0.16;stroke:#4f7d6c;stroke-width:2.4}
    .p2{fill:#a8763f;fill-opacity:0.16;stroke:#a8763f;stroke-width:2.4}
  </style>

  <!-- legend (top-left, left-aligned) -->
  <rect x="46" y="26" width="22" height="15" fill="#4f7d6c" fill-opacity="0.16" stroke="#4f7d6c" stroke-width="2"/>
  <text class="cap" x="76" y="39">Phase I: a triangle meeting I (one clique edge + one vertex of I)</text>
  <rect x="46" y="52" width="22" height="15" fill="#a8763f" fill-opacity="0.16" stroke="#a8763f" stroke-width="2"/>
  <text class="cap" x="76" y="65">Phase II: a residual triangle entirely inside the clique</text>

  <!-- clique region -->
  <ellipse cx="330" cy="300" rx="205" ry="185" fill="#4e6e8e" fill-opacity="0.05" stroke="#4e6e8e" stroke-opacity="0.35" stroke-width="1.4"/>

  <!-- one faint clique edge (top) to hint that K carries further edges; no crossing diagonals -->
  <line class="ce" x1="250" y1="215" x2="420" y2="225"/>
  <!-- one faint adjacency from I into K -->
  <line class="ce" x1="675" y1="395" x2="420" y2="390"/>

  <!-- Phase II triangle: clique vertices k1,k3,k4 -->
  <polygon class="p2" points="250,215 250,390 420,390"/>
  <!-- Phase I triangle: clique edge k2-k4 + independent vertex v1 -->
  <polygon class="p1" points="420,225 420,390 645,300"/>

  <!-- clique vertices -->
  <circle class="kn" cx="250" cy="215" r="11"/>
  <circle class="kn" cx="420" cy="225" r="11"/>
  <circle class="kn" cx="250" cy="390" r="11"/>
  <circle class="kn" cx="420" cy="390" r="11"/>

  <!-- independent set vertices -->
  <circle class="in" cx="645" cy="300" r="11"/>
  <circle class="in" cx="675" cy="395" r="11"/>
  <circle class="in" cx="655" cy="470" r="11"/>
  <circle class="in" cx="690" cy="215" r="11"/>

  <!-- labels -->
  <text class="lbl" x="330" y="515" text-anchor="middle">Clique K (complete)</text>
  <text class="lbl" x="665" y="515" text-anchor="middle">Independent set I</text>
</svg>

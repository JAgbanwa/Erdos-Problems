<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="Georgia, 'Times New Roman', serif">
  <style>
    .lbl{font-size:18px;fill:#2b2b2b}
    .cap{font-size:15px;fill:#3a3a3a}
    .kn{fill:#52657b;stroke:#2f3b47;stroke-width:1.4}
    .in{fill:#9aa3ad;stroke:#5c636b;stroke-width:1.4}
    .ke{stroke:#7f8b98;stroke-width:1.5}
    .cross{stroke:#c3c7cd;stroke-width:1.1}
    .tri{fill:#4f7d6c;fill-opacity:0.16;stroke:#4f7d6c;stroke-width:2.4}
  </style>

  <!-- clique region -->
  <ellipse cx="210" cy="225" rx="150" ry="150" fill="#4e6e8e" fill-opacity="0.05" stroke="#4e6e8e" stroke-opacity="0.35"/>
  <!-- independent region -->
  <ellipse cx="620" cy="225" rx="145" ry="150" fill="#9aa3ad" fill-opacity="0.05" stroke="#9aa3ad" stroke-opacity="0.35"/>

  <!-- cross edges (complete join) faint -->
  <line class="cross" x1="290" y1="160" x2="560" y2="140"/>
  <line class="cross" x1="290" y1="160" x2="615" y2="225"/>
  <line class="cross" x1="290" y1="160" x2="560" y2="315"/>
  <line class="cross" x1="290" y1="300" x2="560" y2="140"/>
  <line class="cross" x1="290" y1="300" x2="615" y2="225"/>
  <line class="cross" x1="290" y1="300" x2="560" y2="315"/>
  <line class="cross" x1="150" y1="150" x2="560" y2="140"/>
  <line class="cross" x1="160" y1="300" x2="560" y2="315"/>

  <!-- highlighted triangle: clique edge k2-k4 + independent vertex i2 -->
  <polygon class="tri" points="290,160 290,300 615,225"/>

  <!-- clique K_p edges (complete, visible) -->
  <line class="ke" x1="150" y1="150" x2="290" y2="160"/>
  <line class="ke" x1="150" y1="150" x2="160" y2="300"/>
  <line class="ke" x1="150" y1="150" x2="290" y2="300"/>
  <line class="ke" x1="290" y1="160" x2="160" y2="300"/>
  <line class="ke" x1="290" y1="160" x2="290" y2="300"/>
  <line class="ke" x1="160" y1="300" x2="290" y2="300"/>

  <!-- clique vertices -->
  <circle class="kn" cx="150" cy="150" r="11"/>
  <circle class="kn" cx="290" cy="160" r="11"/>
  <circle class="kn" cx="160" cy="300" r="11"/>
  <circle class="kn" cx="290" cy="300" r="11"/>

  <!-- independent vertices -->
  <circle class="in" cx="560" cy="140" r="11"/>
  <circle class="in" cx="615" cy="225" r="11"/>
  <circle class="in" cx="560" cy="315" r="11"/>
  <circle class="in" cx="655" cy="150" r="11"/>
  <circle class="in" cx="650" cy="305" r="11"/>

  <!-- labels -->
  <text class="lbl" x="210" y="415" text-anchor="middle">clique K_p</text>
  <text class="lbl" x="620" y="415" text-anchor="middle">conjunto independiente (q vértices)</text>
  <text class="cap" x="410" y="450" text-anchor="middle">S(p,q) = K_p ∨ K̄_q: están todas las aristas entre las partes y todo triángulo usa una arista de la clique</text>
</svg>
